name: ci

on:
  push:
    branches:
      - "main"
      - "test/amd-panel-security-20261017"
      - "feature/update-source-policy"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true
  
env:
  CHANNEL: ${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'feature/update-source-policy' && 'update-source' || 'amd-panel-security' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-amd64:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-amd64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/api:${{ env.CHANNEL }}-amd64
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-amd64
  build-arm64:
    needs: tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/api:buildcache-arm64,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/api:${{ env.CHANNEL }}-arm64
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-arm64
  merge:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create -t ghcr.io/${{ env.OWNER }}/api:${{ env.CHANNEL }} \
            ghcr.io/${{ env.OWNER }}/api:${{ env.CHANNEL }}-amd64 \
            ghcr.io/${{ env.OWNER }}/api:${{ env.CHANNEL }}-arm64
          docker buildx imagetools create -t ghcr.io/${{ env.OWNER }}/api:${{ github.sha }} \
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.OWNER }}/api:${{ github.sha }}-arm64